<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MKF Bookings</title>
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#F4F6F7">
<meta name="robots" content="noindex">
<style>
  html, body { margin: 0; height: 100%; background: #F4F6F7; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; }
</style>
</head>
<body>
<!-- MKF Bookings: shows the Google Apps Script app full screen, without Google's banner.
     Contract (?sign=) and receipt (?receipt=) codes are passed through to the app. -->
<iframe id="app" title="MKF Bookings" allow="camera; clipboard-write; fullscreen"></iframe>
<script>
  var APP = 'https://script.google.com/macros/s/AKfycbyW71pxUxwMdRvySPoKhuoTuacz-RRLGNi1Vl-1b8ymEIuGVxXIoFSp3cK29TCm9V0M4Q/exec';
  var q = new URLSearchParams(location.search), keep = new URLSearchParams();
  ['sign', 'receipt'].forEach(function (k) {
    var v = q.get(k);
    if (v && v.length <= 300) keep.set(k, v);
  });
  var s = keep.toString();
  if (s) {
    document.getElementById('app').src = APP + '?' + s;   // renter contract / receipt only
  } else {
    // Plain address: nothing to open here (the staff app is not reachable from this page).
    document.getElementById('app').remove();
    document.body.innerHTML = '<div style="font-family:system-ui,sans-serif;text-align:center;padding:60px 20px;color:#334">' +
      '<img src="icon-192.png" alt="MKF Car Rentals" style="width:120px;height:120px">' +
      '<h1 style="font-size:20px;margin:16px 0 6px">M.K.F Car Rentals Inc.</h1>' +
      '<p style="margin:0;color:#667">Use the link in your message to open your rental agreement or receipt.</p></div>';
  }
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});
</script>
</body>
</html>
